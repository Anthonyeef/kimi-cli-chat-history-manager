<!DOCTYPE html>
<html>
<head>
    <title>Simple Heatmap Test</title>
    <style>
        .heatmap { display: flex; gap: 2px; padding: 20px; font-family: sans-serif; }
        .heatmap-week { display: flex; flex-direction: column; gap: 2px; }
        .heatmap-day {
            width: 12px;
            height: 12px;
            border-radius: 2px;
            background: #ebedf0;
            position: relative;
        }
        .heatmap-day.level-1 { background: #9be9a8; }
        .heatmap-day.level-2 { background: #40c463; }
        .heatmap-day.level-3 { background: #30a14e; }
        .heatmap-day.level-4 { background: #216e39; }
        .debug { padding: 20px; font-family: monospace; }
    </style>
</head>
<body>
    <h1>Heatmap Test - Direct API</h1>
    <div class="debug" id="debug">Loading...</div>
    <div class="heatmap" id="heatmap"></div>
    
    <script>
        fetch('http://127.0.0.1:8001/api/v1/activity?days=90')
            .then(r => {
                console.log('Response status:', r.status);
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return r.json();
            })
            .then(data => {
                const debug = document.getElementById('debug');
                const activity = data.activity;
                
                debug.innerHTML = `
                    <p><strong>Total days:</strong> ${activity.length}</p>
                    <p><strong>Last 10 days:</strong></p>
                    ${activity.slice(-10).map(d => 
                        `<div>${d.date}: ${d.count} chats ${d.count > 0 ? '🔥' : ''}</div>`
                    ).join('')}
                `;
                
                // Render the heatmap
                const activeDays = activity.filter(d => d.count > 0);
                if (activeDays.length === 0) {
                    debug.innerHTML += '<p style="color: red;">⚠️ No active days found!</p>';
                    return;
                }
                
                // Simple rendering: just show the last 30 days in a single row
                const heatmap = document.getElementById('heatmap');
                const html = activity.slice(-30).map(day => {
                    const level = day.count > 0 ? 1 : 0;
                    return `<div class="heatmap-day level-${level}" title="${day.date}: ${day.count} chats"></div>`;
                }).join('');
                
                heatmap.innerHTML = html;
                debug.innerHTML += `<p style="color: green;">✅ Heatmap rendered with ${activeDays.length} active days</p>`;
            })
            .catch(err => {
                document.getElementById('debug').innerHTML = 
                    `<div style="color: red;">❌ Error: ${err.message}</div>`;
            });
    </script>
</body>
</html>
